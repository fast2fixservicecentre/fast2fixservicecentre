Please fill the details. Your enquiry will open directly in WhatsApp.
</p>

<!-- 1. APPLIANCE FIRST -->

</select>


<!-- 2. SERVICE REQUIRED -->

<option value="">Select Service</option>
<option>Repair</option>
<option>Installation</option>
<option>Uninstallation</option>
<option>Shifting</option>
<option>Service / Maintenance</option>
<option>Inspection / Diagnosis</option>
<option>Other</option>

</select>


<!-- APPLIANCE TYPE -->

<div id="applianceOptionsBox" class="hidden-field">

<label id="applianceOptionsLabel">
Appliance Type
</label>

<select id="applianceOptions" required>
<option value="">Select Type</option>
</select>

</div>


<!-- TV SIZE -->

<div id="tvSizeBox" class="hidden-field">

<label>TV Size</label>

<select id="tvSize">

<option value="">Select TV Size</option>
<option>24 Inch</option>
<option>32 Inch</option>
<option>40 Inch</option>
<option>43 Inch</option>
<option>50 Inch</option>
<option>55 Inch</option>
<option>65 Inch</option>
<option>75 Inch</option>
<option>85 Inch</option>
<option>Other</option>

</select>

</div>


<!-- BRAND -->

<div id="brandBox" class="hidden-field">

<label>Brand</label>

<select id="brand" required>

<option value="">Select Brand</option>

</select>

</div>


<!-- CITY -->

<label>City / Service Location</label>

<select id="customerCity" required>

<option value="">Select City</option>
<option>Dhanbad</option>
<option>Kharagpur</option>
<option>Bokaro</option>
<option>Ranchi</option>
<option>Jamshedpur</option>
<option>Other</option>

</select>


<!-- PIN -->

<label>PIN Code</label>

<input
type="text"
id="customerPin"
placeholder="Enter 6 digit PIN Code"
inputmode="numeric"
maxlength="6"
pattern="[0-9]{6}"
required>


<!-- NAME -->

<label>Your Name</label>

<input
type="text"
id="customerName"
placeholder="Your Name"
required>


<!-- MOBILE -->

<label>Mobile Number</label>

<input
type="tel"
id="customerPhone"
placeholder="10 Digit Mobile Number"
inputmode="numeric"
maxlength="10"
pattern="[0-9]{10}"
required>


<!-- PROBLEM -->

<label>Problem / Requirement</label>

<textarea
id="customerMessage"
rows="4"
placeholder="Describe your appliance problem or requirement"></textarea>


<div class="booking-note">
📲 After submitting, WhatsApp will open with all enquiry details automatically filled in.
</div>


<button class="submit" type="submit">
💬 Send Enquiry on WhatsApp
</button>

</form>

</div>
</div>

/* =========================================
   UPDATE APPLIANCE OPTIONS
========================================= */

function updateApplianceOptions(){

let appliance =
document.getElementById("applianceType").value;

let optionsBox =
document.getElementById("applianceOptionsBox");

let optionsLabel =
document.getElementById("applianceOptionsLabel");

let options =
document.getElementById("applianceOptions");

let brandBox =
document.getElementById("brandBox");

let brand =
document.getElementById("brand");

let tvSizeBox =
document.getElementById("tvSizeBox");


options.innerHTML =
'<option value="">Select Type</option>';

brand.innerHTML =
'<option value="">Select Brand</option>';

tvSizeBox.style.display="none";


if(!appliance){

optionsBox.style.display="none";
brandBox.style.display="none";

options.required=false;
brand.required=false;

return;

}


let data = applianceData[appliance];


optionsBox.style.display="block";
brandBox.style.display="block";

options.required=true;
brand.required=true;


optionsLabel.innerText =
appliance + " Type";


data.types.forEach(function(type){

let option =
document.createElement("option");

option.value=type;
option.textContent=type;

options.appendChild(option);

});


data.brands.forEach(function(brandName){

let option =
document.createElement("option");

option.value=brandName;
option.textContent=brandName;

brand.appendChild(option);

});


/* TV SIZE ONLY FOR TV */

if(appliance==="TV"){

tvSizeBox.style.display="block";

document.getElementById("tvSize").required=true;

}else{

document.getElementById("tvSize").required=false;

}

}

/* =========================================

========================================= */

function toggleBranch(id){

let gallery =
document.getElementById(id);

if(gallery.style.display==="block"){

gallery.style.display="none";

}else{

gallery.style.display="block";

}

}


function closeBranch(event,id){

event.stopPropagation();

document.getElementById(id).style.display="none";

}


/* =========================================
   ONLINE REACH COUNTER
========================================= */

function animateCounter(element){

let target =
parseInt(
element.getAttribute("data-target")
);

let current=0;

let increment =
Math.max(
1,
Math.ceil(target/80)
);

let timer =
setInterval(function(){

current += increment;

if(current >= target){

current=target;

clearInterval(timer);

}

if(target>=1000){

element.innerText =
current.toLocaleString()+"+";

}else{

element.innerText =
current+"+";

}

},20);

}


let counterStarted=false;


function startCounters(){

if(counterStarted) return;


let section =
document.querySelector(".reach");


if(!section) return;


let position =
section.getBoundingClientRect().top;


if(position < window.innerHeight-100){

counterStarted=true;


document
.querySelectorAll(".counter")
.forEach(function(counter){

animateCounter(counter);

});

}

}


window.addEventListener(
"scroll",
startCounters
);

window.addEventListener(
"load",
startCounters
);
